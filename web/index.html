<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PassItOn - Peer-to-peer campus marketplace">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PassItOn">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PassItOn - Campus Marketplace</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,600..800;1,6..96,600..700&family=EB+Garamond:ital,wght@0,400..700;1,400..600&family=Italiana&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F3F1EC;
      font-family: 'EB Garamond', Georgia, serif;
    }
    #loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #E0DCD3;
      border-top-color: #252832;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .brand {
      margin-top: 18px;
      font-family: 'Italiana', 'Bodoni Moda', Georgia, serif;
      font-size: 32px;
      font-weight: 400;
      color: #252832;
      letter-spacing: 0.6px;
    }
    .tagline {
      margin-top: 4px;
      font-size: 13px;
      color: #7A8191;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="brand">PassItOn</div>
    <div class="tagline">Campus Marketplace</div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        var hadSw = regs && regs.length > 0;
        Promise.all(regs.map(function(r) { return r.unregister(); })).then(function() {
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }).then(function() {
              if (hadSw && !sessionStorage.getItem('pio_sw_cleared')) {
                sessionStorage.setItem('pio_sw_cleared', '1');
                window.location.reload();
              }
            });
          }
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
